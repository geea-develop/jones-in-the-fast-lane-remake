name: Deploy Client to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:shared

      - name: Build client
        env:
          NEXT_PUBLIC_BASE_PATH: /jones-in-the-fast-lane-remake
          NEXT_PUBLIC_API_URL: https://jones-server.onrender.com
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
        run: npm run build:client

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
