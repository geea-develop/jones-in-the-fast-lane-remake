name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure local test server
        run: cp apps/server/.env.example apps/server/.env

      - name: Build shared package
        # The @jones/server tests import @jones/shared from its built dist/
        # output. On a clean CI checkout that output does not exist yet, so the
        # server test must be preceded by building the shared workspace,
        # otherwise it fails with "Cannot find package '@jones/shared/dist/index.js'".
        run: npm run build:shared

      - name: Lint
        run: npm run lint

      - name: Test server
        run: npm run test --workspace=@jones/server

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Test end to end
        run: npm run test:e2e
