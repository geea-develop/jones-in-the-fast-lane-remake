services:
  - type: web
    name: jones-server
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: |
      npm ci &&
      npm run build:shared &&
      npm run build:server
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
